# DOSBox-X configuration for PCBoard 15.3/15.4 compilation
# Place this file alongside dosbox-x or pass with: dosbox-x -conf DOSBOX.CFG

[dosbox]
title=PCBoard Build Environment
memsize=64
machine=svga_s3

[cpu]
core=auto
cputype=pentium
cycles=max

[dos]
umb=true
ems=true
xms=true
keyboardlayout=us
ver=7.1

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[autoexec]
# Mount the repo as C:
# Edit this path to match your repo location
mount C .

# BC31 is inside PCB153BT.ZIP — extract to C:\BC31
# Or mount separately: mount B path\to\bc31
set BC31PATH=C:\BC31
set PATH=C:\BC31\BIN;%PATH%
set INCLUDE=C:\BC31\INCLUDE
set LIB=C:\BC31\LIB

# Watcom (if installed under DOSBox)
# set WATCOM=C:\WATCOM
# set PATH=%WATCOM%\BINW;%PATH%
# set INCLUDE=%WATCOM%\H

echo.
echo  PCBoard Build Environment
echo  ========================
echo.
echo  The repo is mounted as C:, so \OUT, \PCB153, \TOOLKIT and
echo  \PCBCBASE are all inside the repo.
echo.
echo  15.3 PWA (Borland C++ 3.1):
echo    BLDDOS ALL          build every program  -^> \OUT\PWA153
echo    BLDDOS MAKEIDX      build one
echo    BLDDOS CLEAN        make CLEAN everywhere
echo    BLDDOS ALL ^> \OUT\BUILD.LOG    keep a log
echo.
echo  OS/2 (Borland C++ for OS/2, run on OS/2):
echo    BLDOS2 PCBOARD2
echo.
echo  See MAIN\build\BUILD-ROOT.md for the build-root rule.
echo.
C:
