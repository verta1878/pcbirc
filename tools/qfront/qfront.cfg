# QFront v0.1.0 Configuration
# Clean-room FidoNet mailer orchestrator

# Our FidoNet address(es)
Address=1:234/56

# BSO outbound directory
Outbound=/var/spool/fido/outbound

# Inbound directories
Inbound=/var/spool/fido/inbound
TempInbound=/var/spool/fido/temp

# Netmail storage
NetmailDir=/var/spool/fido/netmail

# External mailer (binkd for BinkP sessions)
Mailer=/usr/local/bin/binkd

# Tosser (runs after receiving mail)
Tosser=/usr/local/bin/hpt toss

# TIC processor (runs after receiving files)
TicProc=/usr/local/bin/htick toss

# Nodelist
NodelistDir=/var/spool/fido/nodelist
NodelistBase=NODELIST

# Session parameters
MaxRetries=5
RetryDelay=300
HoldTime=3600

# Logging
LogFile=/var/log/qfront.log
Debug=0
