[sdl]
output=surface
[dosbox]
machine=svga_s3
memsize=64
[sblaster]
sbtype=none
[gus]
gus=false
[speaker]
pcspeaker=false
tandy=off
[dos]
zero unused int 68h=true
ver=7.10
[cpu]
core=normal
cputype=pentium
cycles=max
[autoexec]
mount c /home/claude/dosboxx-work -freesize 500
c:
set path=c:\bc31\bin;c:\fdos\bin;c:\
set include=c:\bc31\include
set lib=c:\bc31\lib
set tmp=c:\tmp
if not exist c:\tmp md c:\tmp
if not exist c:\tmp\cbobj md c:\tmp\cbobj
call c:\bldcb4.bat
exit
