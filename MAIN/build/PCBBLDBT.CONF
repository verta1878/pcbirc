# ============================================================================
# PCBBLDBT.CONF - DOSBox-X launcher config for the pcbirc golden build image
#
# Boots FreeDOS from a 1.44M floppy launcher (fdboot_launch.img), which chains
# to C: (PCBBLDBT.IMG) via a modified FDAUTO.BAT.
#
# Provides everything on C: needed to build the pwa153 SDK + host the crew's
# forward DPMI-based tools (HDPMI, DOS/32A, and eventually 386MAX).
#
# Files this config expects at /tmp/goldimg/ (paths customized per host):
#   fdboot_launch.img - FreeDOS 1.3 floppy with modified FDAUTO.BAT
#   PCBBLDBT.IMG      - 96 MB FAT16 HDD image (195 cyls x 16 heads x 63 spt)
#                       built by MAIN/build/scripts/mkimage.sh
#
# See also:
#   MAIN/build/PCBBLDBT-ROADMAP.md   - what the image contains at each milestone
#   MAIN/build/scripts/mkimage.sh    - image bootstrap (right-sized, reproducible)
#   todo/dosboxx-dpmi-failures.md    - config knobs tried; failures ledger
#   todo/386max-build-downgrade.md   - 386MAX.SYS build under this config (Phase A);
#                                      Phase B runtime test needs QEMU/86Box/PCem
#                                      (386MAX is a DEVICE= memory manager that
#                                      hooks the CPU at boot; DOSBox-X can build
#                                      but cannot load it as a guest driver)
# ============================================================================

[dosbox]
memsize=64
title=pcbirc-pcbbldbt

[cpu]
cputype=pentium
cycles=max

[dos]
ver=7.10
# --- CRITICAL: DOSBox-X uses INT 68h internally by default, which collides
# --- with HX HDPMI32/HDPMI16 and any other DPMI host that hooks INT 68h.
# --- Setting this to true frees INT 68h for guest-side use.
# --- Resolves Failure #1 in todo/dosboxx-dpmi-failures.md.
zero unused int 68h=true

[sblaster]
sbtype=none
[gus]
gus=false
[speaker]
pcspeaker=false
disney=false
tandy=off

[autoexec]
# Paths below assume the image + floppy live at /tmp/goldimg/. Adjust for host.
imgmount 0 /tmp/goldimg/fdboot_launch.img -t floppy
imgmount 2 /tmp/goldimg/PCBBLDBT.IMG -t hdd -fs none -size 512,63,16,195
boot -l a
