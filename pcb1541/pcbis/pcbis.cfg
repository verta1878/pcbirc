# pcbis.cfg — pcboard internet services configuration
# pcboard 15.4 revival

[general]
pcbdir = /pcb
logdir = /pcb/logs
pidfile = pcbis.pid
max_connections = 32

[telnet]
enabled = yes
listen = 0.0.0.0
port = 2323
max_nodes = 4
node_start = 1
fossil_mode = pty
idle_timeout = 300

[binkp]
enabled = yes
listen = 0.0.0.0
port = 24554
address = 1:123/456.0
password = changeme
inbound = /pcb/inbound
outbound = /pcb/outbound
qfront_dir = /pcb/qfront

[ftp]
enabled = yes
listen = 0.0.0.0
port = 21
pasv_min = 10000
pasv_max = 10100
anonymous = yes
anon_security = 10

[http]
enabled = yes
listen = 0.0.0.0
port = 8080
docroot = /pcb/www

[smtp]
enabled = yes
relay = smtp.example.com
relay_port = 587
from = pcboard@bbs.example.com
use_tls = no
trigger_dir = /pcb/email_queue

[events]
event1_time = 02:00
event1_batch = /pcb/events/maint.sh
event1_days = mtwtfss
event1_desc = nightly maintenance

event2_time = 06:00
event2_batch = /pcb/events/binkpoll.sh
event2_days = mtwtfss
event2_desc = morning binkp poll

event3_time = 00:00
event3_batch = /pcb/events/logrot.sh
event3_days = mtwtfss
event3_desc = log rotation

event4_time = 04:00
event4_batch = /pcb/events/qwkxfer.sh
event4_days = mtwtf--
event4_desc = qwk network exchange

# event5_time =
# event5_batch =
# event6_time =
# event6_batch =

[logging]
level = info
rotate_days = 30

[security]
max_failed_logins = 3
block_duration = 300

[qwk]
enabled = yes
board_id = pcbrev
hub_url = ftp://qwkhub.example.com/qwk/
hub_user = pcbrev
hub_pass = qwkpass
schedule = 04:00

[uucp2]
enabled = no
host = uucp.provider.com
port = 540
login = pcbboard
password = uucppass
spool_dir = /pcb/uucp/spool

[nntp]
enabled = no
server = news.example.com
port = 119
user =
pass =
