; ====================================================================
; pcbpscan.cfg — pcboard file scanner configuration
; ====================================================================
; place this file alongside pcbpscan.exe.
;
; clamav setup:
;   1. download clamav from https://www.clamav.net/downloads
;      (windows msi installer or portable zip)
;   2. install or unzip to c:\clamav (or your preferred path)
;   3. copy clamd.conf.sample to clamd.conf, freshclam.conf.sample
;      to freshclam.conf, and edit both to remove the "example" line
;   4. run: freshclam          (downloads virus signatures, ~110mb)
;   5. set av_cmd below to point to clamscan.exe
;
; clamav exit codes (handled by pcbpscan):
;   0 = file is clean
;   1 = virus/malware found → pcbpscan returns fail (exit 1)
;   2 = scanner error       → pcbpscan returns error (exit 2)
;
; to use a different scanner, replace av_cmd with its command line.
; the uploaded file path is appended automatically.
; ====================================================================

; virus scanner command — uncomment and set path for your system
; the file path is appended to the end automatically.
;
; clamav (windows):
av_cmd=c:\clamav\clamscan.exe --no-summary
;
; clamav (os/2 or linux):
; av_cmd=/usr/bin/clamscan --no-summary
;
; mcafee uvscan:
; av_cmd=c:\mcafee\uvscan.exe /secure
;
; no scanner (comment out av_cmd or leave blank):
; av_cmd=

; verbose output (0=quiet, 1=verbose)
verbose=0

; maximum file size in bytes (default 100mb)
; files larger than this are rejected
max_file_size=104857600

; maximum files inside one archive (zip bomb protection)
max_files_in_arc=10000

; banned file extensions (space-separated, case-insensitive)
; these are rejected on upload regardless of content
banned_exts=.exe .com .bat .cmd .scr .pif .vbs .js .ws .wsh .msi

; write file_id.diz to upload description file (1=yes, 0=no)
; when enabled, extracted diz replaces the caller's description
diz_to_desc=1

; pcboard dir listing file to append new entries to
; leave blank to disable automatic dir updates
; example: c:\pcb\gen\dir0
dir_file=
